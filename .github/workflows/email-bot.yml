name: 📧 Email Bot Auto-Sender

on:
  # Every 5 minutes
  schedule:
    - cron: '*/5 * * * *'

  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Batch size (10-50)'
        required: false
        default: '15'

  # Trigger on push to main
  push:
    branches: [main]
    paths:
      - 'scripts/bot.js'
      - '.github/workflows/email-bot.yml'

jobs:
  send-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx prisma generate --no-engine 2>/dev/null || npx prisma generate

      - name: Run Email Bot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          NODE_ENV: production
          BOT_BATCH_SIZE: ${{ github.event.inputs.batch_size || '15' }}
          BOT_DELAY_MS: '1500'
          BOT_MAX_RUNTIME: '50'
        run: node scripts/bot.js
