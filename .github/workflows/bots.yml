name: 🤖 Email Bots (3 Parallel)

on:
  # Schedule — every 5 min
  schedule:
    - cron: '*/5 * * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Batch size per bot (10-40)'
        required: false
        default: '20'
      mode:
        description: 'run | once'
        required: false
        default: 'run'

  # API trigger from Vercel (repository_dispatch)
  repository_dispatch:
    types: [start-campaign]

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bot: [bot1, bot2, bot3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run ${{ matrix.bot }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          NODE_ENV: production
          BOT_ID: ${{ matrix.bot }}
          BOT_BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
          BOT_DELAY_MS: '1200'
        run: node scripts/bot-parallel.js
